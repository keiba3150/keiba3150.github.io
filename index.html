<body>
  <h1>総合指数ボード</h1>
  <p>JRA(中央競馬)のレースごとに、機械学習モデルによる総合指数(index_score)ランキングを毎日公開しているサイトです。</p>
  <ul>
    <li>出走馬を指数の高い順に並べたレースカードを、レースごとに掲載</li>
    <li>過去日の指数と実際の着順を照合した成績サマリー(的中率・回収率)</li>
    <li>日別の本命(指数1位)ピックアップ</li>
  </ul>
  <p>重賞レース(G1・G2・G3)の詳細な予想は、月額プランにご登録いただいた会員限定でご覧いただけます。</p>
